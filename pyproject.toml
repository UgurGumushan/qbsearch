# qBittorrent search-engine plugin collection. Each file in plugins/ is a
# standalone nova3 engine; qBitt (Python 3) imports them directly, so no shared
# modules exist. See test/engines.py for the installability harness.

[tool.ruff]
target-version = "py39"
line-length = 100
# Ignore optional local upstream snapshots and generated/tooling artifacts.
exclude = ["external", "node_modules", "working", ".opencode"]

[tool.ruff.lint]
# Require public API documentation and reject empty docstrings without changing
# the existing default lint selection.
# Keep the selection in tool/checks/python_documentation.ts aligned with these rules.
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D419"]
# Intentional scraper idioms the repo keeps:
#   BLE001  broad `except Exception` keeps one engine's failure from crashing
#           the qBitt process.
#   DTZ*    engines use naive datetimes because the sites return local time.
#   S110/S112  per-row int-parse swallows are deliberate tolerance.
# B005 and TRY002 are NOT ignored — they are fixed outright.
ignore = [
    "BLE001",
    "DTZ004",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "DTZ011",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
"typings/*.pyi" = ["D"]

[tool.basedpyright]
pythonVersion = "3.9"
exclude = ["external", ".venv", "node_modules", "working", ".opencode", ".ruff_cache"]

# qBitt's nova3 modules (`helpers`, `novaprinter`, `socks`) and `requests`
# (one engine) live inside qBitt's installation, not on the host. typings/
# holds exact stubs copied from the real nova3 sources.
extraPaths = ["typings"]

# The engines import qBitt's modules at runtime; keep per-row import checks
# pointed at the stubs rather than silenced.
executionEnvironments = [
    { root = "plugins", reportMissingModuleSource = "none" },
]

name: Release plugins

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bun
        env:
          BUN_INSTALL: ${{ runner.temp }}/bun
        run: |
          curl --fail --silent --show-error --location https://bun.com/install | bash -s -- bun-v1.3.14
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          "$BUN_INSTALL/bin/bun" --version
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Install release checkers
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Verify repository
        run: bun run check
      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bun run release -- --version "${RELEASE_VERSION#v}" --output "working/qbsearch-${RELEASE_VERSION#v}.zip"
      - name: Create stable download alias
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: cp "working/qbsearch-${RELEASE_VERSION#v}.zip" working/qbsearch-latest.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f "documentation/releases/${RELEASE_TAG}.md" ]; then
            gh release create "$RELEASE_TAG" \
              "working/qbsearch-${RELEASE_TAG#v}.zip" \
              working/qbsearch-latest.zip \
              --notes-file "documentation/releases/${RELEASE_TAG}.md"
          else
            gh release create "$RELEASE_TAG" \
              "working/qbsearch-${RELEASE_TAG#v}.zip" \
              working/qbsearch-latest.zip \
              --generate-notes
          fi

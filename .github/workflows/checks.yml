name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Bun
        env:
          BUN_INSTALL: ${{ runner.temp }}/bun
        run: |
          curl --fail --silent --show-error --location https://bun.com/install | bash -s -- bun-v1.3.14
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          "$BUN_INSTALL/bin/bun" --version
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Install development checkers
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Run repository checks
        run: bun run check

name: Live plugin check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: live-plugin-check
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Run real remote-service smoke tests
        run: bun run test:live -- --skip-safety --timeout 120
